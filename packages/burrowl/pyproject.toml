[project]
name = "burrowl"
version = "0.5.2"
description = "AI 研发工作区：版本化记忆、检索、阅读会话与知识中枢连接"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "keyring>=25",
    "mcp>=1.10",
    "pydantic>=2.9",
    "sqlite-vec>=0.1.6",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
models = [
    "fastembed>=0.8",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.scripts]
burrowl = "burrowl.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
